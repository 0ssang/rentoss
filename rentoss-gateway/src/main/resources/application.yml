server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # User Service
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /login/oauth2/**, /oauth2/**

        # Item Service
        - id: item-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/items/**

        # Rental Service
        - id: rental-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/rentals/**

        # Chat Service
        - id: chat-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/chats/**, /ws/chat/**

        # Community Service
        - id: community-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/posts/**

        # Payment Service
        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/payments/**, /api/v1/settlements/**

        # Notification Service
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/notifications/**

jwt:
  secret: ${JWT_SECRET}
  access-token-cookie-name: ${JWT_ACCESS_TOKEN_COOKIE_NAME:access_token}
